name: TV emulator trial

on:
  # El disparador `push` existe porque GitHub solo expone `workflow_dispatch`
  # desde la rama por defecto. Se limita a la rama de E1 para que no se ejecute
  # en `main` ni en otras ramas. `workflow_dispatch` se conserva para
  # ejecuciones manuales.
  push:
    branches:
      - feat/e1-bootstrap
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tv-trial:
    name: tv-emulator-trial
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Ensayar imagen de Android TV
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: true
          script: |
            # La action ejecuta este bloque con `/usr/bin/sh` (dash), donde
            # `set -o pipefail` no existe. `set -eu` conserva el aborto ante
            # cualquier comando que falle.
            set -eu
            adb wait-for-device
            echo "== características =="
            adb shell getprop ro.build.characteristics
            echo "== leanback =="
            adb shell pm list features | grep -i leanback
            echo "== tamaño de pantalla =="
            adb shell wm size
            echo "== canario de TV =="
            ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.copernicotv.app.CanarioTvTest
      - name: Publicar reporte del ensayo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-tv-trial
          path: app/build/reports/androidTests/
          if-no-files-found: ignore
