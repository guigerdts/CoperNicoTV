name: Release OTA

# Publica una versión instalable de CoperNicoTV: APK firmado, manifiesto
# `update.json` y su firma separada `update.json.sig`. Es el único workflow que
# escribe en Releases; la CI normal no publica nada.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag existente a publicar (por ejemplo v1.2.0)"
        required: true
      canal:
        description: "Canal del manifiesto"
        type: choice
        options: ["stable", "beta"]
        default: "beta"
      obligatoria:
        description: "Marcar la actualización como obligatoria"
        type: boolean
        default: false
      notas:
        description: "Notas del manifiesto (vacío: usa el mensaje del tag)"
        required: false

permissions:
  contents: write

concurrency:
  # Una publicación no se cancela a la mitad: dos runs sobre el mismo tag
  # podrían dejar el release con el APK de uno y el manifiesto del otro.
  group: release-ota-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publicar:
    name: publicar
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Resolver tag, versión y canal
        id: version
        env:
          TAG_MANUAL: ${{ inputs.tag }}
          CANAL_MANUAL: ${{ inputs.canal }}
          OBLIGATORIA_MANUAL: ${{ inputs.obligatoria }}
          NOTAS_MANUALES: ${{ inputs.notas }}
        run: |
          set -euo pipefail
          if [ -n "${TAG_MANUAL}" ]; then
            TAG="${TAG_MANUAL}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          if ! git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "El tag ${TAG} no existe en el repositorio." >&2
            exit 1
          fi
          VERSION_NAME="${TAG#v}"
          # Monotónico dentro del repositorio: cualquier run posterior tiene un
          # número mayor, así que un release nunca retrocede el versionCode.
          VERSION_CODE="${GITHUB_RUN_NUMBER}"
          if [ -n "${CANAL_MANUAL}" ]; then
            CANAL="${CANAL_MANUAL}"
          elif [[ "${TAG}" == *-beta.* ]]; then
            CANAL="beta"
          else
            CANAL="stable"
          fi
          if [ -n "${NOTAS_MANUALES}" ]; then
            NOTAS="${NOTAS_MANUALES}"
          else
            NOTAS="$(git tag -l --format='%(contents)' "${TAG}")"
          fi
          if [ -z "${NOTAS}" ]; then
            NOTAS="CoperNicoTV ${VERSION_NAME}"
          fi
          OBLIGATORIA="${OBLIGATORIA_MANUAL:-false}"
          {
            echo "tag=${TAG}"
            echo "version_name=${VERSION_NAME}"
            echo "version_code=${VERSION_CODE}"
            echo "canal=${CANAL}"
            echo "obligatoria=${OBLIGATORIA}"
          } >> "${GITHUB_OUTPUT}"
          {
            echo "NOTAS<<__FIN_NOTAS__"
            echo "${NOTAS}"
            echo "__FIN_NOTAS__"
          } >> "${GITHUB_OUTPUT}"

      - name: Verificar que las claves están configuradas
        env:
          OTA_MANIFIESTO_PUBKEY: ${{ vars.OTA_MANIFIESTO_PUBKEY }}
          OTA_CERT_SHA256: ${{ vars.OTA_CERT_SHA256 }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          OTA_SIGNING_KEY_BASE64: ${{ secrets.OTA_SIGNING_KEY_BASE64 }}
        run: |
          set -euo pipefail
          faltan=0
          for NOMBRE in OTA_MANIFIESTO_PUBKEY OTA_CERT_SHA256 ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD OTA_SIGNING_KEY_BASE64; do
            if [ -z "${!NOMBRE:-}" ]; then
              echo "Falta ${NOMBRE}. Ejecutá tools/ota/generar-claves.sh y cargá claves y variables." >&2
              faltan=1
            fi
          done
          exit "${faltan}"

      - name: Materializar claves
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          OTA_SIGNING_KEY_BASE64: ${{ secrets.OTA_SIGNING_KEY_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/release.keystore"
          echo "${OTA_SIGNING_KEY_BASE64}" | base64 -d > "${RUNNER_TEMP}/ota-firma.pem"

      - name: Cache de FFmpeg compilado
        uses: actions/cache@v4
        with:
          path: native/ffmpeg/install
          key: ffmpeg-7.1.1-${{ runner.os }}-${{ hashFiles('scripts/ffmpeg/build-ffmpeg.sh') }}

      - name: Compilar subconjunto FFmpeg (LGPL)
        run: |
          [ -f native/ffmpeg/install/arm64-v8a/lib/libavcodec.a ] || \
            bash scripts/ffmpeg/build-ffmpeg.sh

      - name: Ensamblar APK release firmado
        env:
          OTA_MANIFIESTO_PUBKEY: ${{ vars.OTA_MANIFIESTO_PUBKEY }}
          OTA_CERT_SHA256: ${{ vars.OTA_CERT_SHA256 }}
          OTA_VERSION_CODE: ${{ steps.version.outputs.version_code }}
          OTA_VERSION_NAME: ${{ steps.version.outputs.version_name }}
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Componer y firmar el manifiesto
        id: manifiesto
        env:
          OTA_CERT_SHA256: ${{ vars.OTA_CERT_SHA256 }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          CANAL: ${{ steps.version.outputs.canal }}
          OBLIGATORIA: ${{ steps.version.outputs.obligatoria }}
          NOTAS: ${{ steps.version.outputs.notas }}
          REPOSITORIO: ${{ github.repository }}
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -1)"
          if [ -z "${APK}" ]; then
            echo "No se generó ningún APK release." >&2
            exit 1
          fi
          APK_NOMBRE="copernicotv-${VERSION_NAME}.apk"
          cp "${APK}" "${RUNNER_TEMP}/${APK_NOMBRE}"

          BUILD_TOOLS="$(ls -1d "${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"/build-tools/* | sort -V | tail -1)"
          HUELLA_APK="$(
            "${BUILD_TOOLS}/apksigner" verify --print-certs "${RUNNER_TEMP}/${APK_NOMBRE}" |
              sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1
          )"
          if [ "${HUELLA_APK}" != "${OTA_CERT_SHA256}" ]; then
            echo "La firma del APK (${HUELLA_APK}) no es la fijada en la app (${OTA_CERT_SHA256})." >&2
            echo "El APK instalado rechazaría esta actualización: no se publica." >&2
            exit 1
          fi

          MIN_SDK="$(
            "${BUILD_TOOLS}/aapt2" dump badging "${RUNNER_TEMP}/${APK_NOMBRE}" |
              sed -n "s/^sdkVersion:'\([0-9]\{1,\}\)'.*/\1/p" | head -1
          )"
          if [ -z "${MIN_SDK}" ]; then
            echo "No se pudo leer el minSdk del APK." >&2
            exit 1
          fi

          SHA256="$(sha256sum "${RUNNER_TEMP}/${APK_NOMBRE}" | cut -d' ' -f1)"
          TAMANO="$(stat -c %s "${RUNNER_TEMP}/${APK_NOMBRE}")"
          PUBLICADO="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          jq -n \
            --argjson schema 1 \
            --arg packageName "com.copernicotv.app" \
            --argjson versionCode "${VERSION_CODE}" \
            --arg versionName "${VERSION_NAME}" \
            --arg channel "${CANAL}" \
            --argjson minSdk "${MIN_SDK}" \
            --arg publishedAt "${PUBLICADO}" \
            --argjson sizeBytes "${TAMANO}" \
            --arg sha256 "${SHA256}" \
            --arg downloadUrl "https://github.com/${REPOSITORIO}/releases/download/${TAG}/${APK_NOMBRE}" \
            --arg releaseUrl "https://github.com/${REPOSITORIO}/releases/tag/${TAG}" \
            --arg releaseNotes "${NOTAS}" \
            --argjson mandatory "${OBLIGATORIA}" \
            --arg signingCertSha256 "${HUELLA_APK}" \
            '{
              schema: $schema,
              packageName: $packageName,
              versionCode: $versionCode,
              versionName: $versionName,
              channel: $channel,
              minSdk: $minSdk,
              publishedAt: $publishedAt,
              sizeBytes: $sizeBytes,
              sha256: $sha256,
              downloadUrl: $downloadUrl,
              releaseUrl: $releaseUrl,
              releaseNotes: $releaseNotes,
              mandatory: $mandatory,
              signingCertSha256: $signingCertSha256
            }' > "${RUNNER_TEMP}/update.json"

          openssl dgst -sha256 \
            -sign "${RUNNER_TEMP}/ota-firma.pem" \
            -out "${RUNNER_TEMP}/update.json.sig" \
            "${RUNNER_TEMP}/update.json"
          openssl ec -in "${RUNNER_TEMP}/ota-firma.pem" -pubout \
            -out "${RUNNER_TEMP}/ota-firma.pub.pem" 2>/dev/null
          openssl dgst -sha256 \
            -verify "${RUNNER_TEMP}/ota-firma.pub.pem" \
            -signature "${RUNNER_TEMP}/update.json.sig" \
            "${RUNNER_TEMP}/update.json"

          {
            echo "apk=${RUNNER_TEMP}/${APK_NOMBRE}"
            echo "nombre=${APK_NOMBRE}"
            echo "sha256=${SHA256}"
          } >> "${GITHUB_OUTPUT}"

      - name: Publicar el release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          NOTAS: ${{ steps.version.outputs.notas }}
        run: |
          set -euo pipefail
          if ! gh release view "${TAG}" >/dev/null 2>&1; then
            gh release create "${TAG}" --verify-tag --title "CoperNicoTV ${TAG}" --notes "${NOTAS}"
          fi
          gh release upload "${TAG}" \
            "${{ steps.manifiesto.outputs.apk }}" \
            "${RUNNER_TEMP}/update.json" \
            "${RUNNER_TEMP}/update.json.sig" \
            --clobber

      - name: Resumen
        env:
          TAG: ${{ steps.version.outputs.tag }}
          SHA256: ${{ steps.manifiesto.outputs.sha256 }}
        run: |
          {
            echo "## Release ${TAG}"
            echo
            echo "- APK: \`${{ steps.manifiesto.outputs.nombre }}\`"
            echo "- SHA-256 del APK: \`${SHA256}\`"
            echo "- versionCode: \`${{ steps.version.outputs.version_code }}\`"
            echo "- canal: \`${{ steps.version.outputs.canal }}\`"
            echo "- actualización obligatoria: \`${{ steps.version.outputs.obligatoria }}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
