name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm-tests:
    name: jvm-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Pruebas JVM de :core y :app
        run: ./gradlew :core:test :app:testDebugUnitTest --stacktrace
      - name: Publicar reportes de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-jvm
          path: |
            core/build/reports/tests/
            app/build/reports/tests/
          if-no-files-found: ignore

  static-analysis:
    name: static-analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: ktlint y detekt
        run: ./gradlew ktlintCheck detekt --stacktrace
      - name: Pruebas de los scripts Unicode
        run: python3 -m unittest discover -s tools/unicode -p "test_*.py" -v

  apk:
    name: apk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Ensamblar APK de depuración
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: copernicotv-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Publicar esquema Room exportado
        uses: actions/upload-artifact@v4
        with:
          name: room-schema-v1
          path: app/schemas/**
          if-no-files-found: error

  instrumented-mobile:
    name: instrumented-mobile
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Canario móvil en emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: >-
            ./gradlew :app:connectedDebugAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.class=com.copernicotv.app.CanarioMovilTest,com.copernicotv.app.ClavesKeystoreTest,com.copernicotv.app.CredencialesEnReposoTest
      - name: Publicar reportes instrumentados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-instrumented-mobile
          path: app/build/reports/androidTests/
          if-no-files-found: ignore

  instrumented-tv:
    name: instrumented-tv
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Canario de Android TV en emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: android-tv
          # Android TV solo publica system-images x86 y arm64-v8a para API 34
          # (no existe android-34;android-tv;x86_64). El host del runner es x86_64
          # con KVM, así que la imagen x86 arranca acelerada.
          arch: x86
          profile: tv_1080p
          disable-animations: true
          script: >-
            ./gradlew :app:connectedDebugAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.class=com.copernicotv.app.CanarioTvTest
      - name: Publicar reportes instrumentados de TV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-instrumented-tv
          path: app/build/reports/androidTests/
          if-no-files-found: ignore

  p1-performance:
    name: p1-performance
    # La medición P1 de DC-10 no corre en cada PR: se ejecuta en el runner de
    # referencia mediante workflow_dispatch.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Medicion P1 de parseo
        run: ./gradlew :core:p1Performance -Pp1.commit="$GITHUB_SHA" --stacktrace
      - name: Publicar evidencia P1
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-medicion
          path: core/build/p1/
          if-no-files-found: ignore
      - name: Resumen de la medicion
        if: always()
        run: cat core/build/p1/medicion.json || true
