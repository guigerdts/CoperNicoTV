build:
  maxIssues: 0

complexity:
  LongMethod:
    threshold: 120
  LongParameterList:
    functionThreshold: 12
    constructorThreshold: 12
  TooManyFunctions:
    thresholdInFiles: 30
    thresholdInClasses: 30
    thresholdInInterfaces: 20
    thresholdInObjects: 30
    thresholdInEnums: 20

style:
  MaxLineLength:
    maxLineLength: 140
  MagicNumber:
    active: false
  ReturnCount:
    max: 6
  UnusedPrivateMember:
    active: true
  ThrowsCount:
    max: 4

naming:
  FunctionNaming:
    ignoreAnnotated:
      - Composable

exceptions:
  TooGenericExceptionCaught:
    active: false
  SwallowedException:
    active: false
