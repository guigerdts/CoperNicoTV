name: Release OTA

# Valida una versión: compila el APK firmado, compone y firma el manifiesto
# `update.json`, y publica los tres archivos como artifact. NO crea ni modifica
# Releases: la publicación es un workflow_dispatch aparte (`release-publish.yml`)
# que descarga exactamente este artifact, sin recompilar ni volver a firmar.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag existente a validar (por ejemplo v1.2.0)"
        required: true
      canal:
        description: "Canal del manifiesto"
        type: choice
        options: ["stable", "beta"]
        default: "beta"
      obligatoria:
        description: "Marcar la actualización como obligatoria"
        type: boolean
        default: false
      notas:
        description: "Notas del manifiesto (vacío: usa el mensaje del tag)"
        required: false

permissions:
  # Este workflow no escribe en el repositorio ni en Releases. Subir un artifact
  # no requiere permisos del token.
  contents: read

concurrency:
  # Una validación no se cancela a la mitad: el artifact publicado por el run
  # cancelado dejaría de existir para la publicación posterior.
  group: release-ota-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validar:
    name: validar
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Resolver tag, versión y canal
        id: version
        env:
          TAG_MANUAL: ${{ inputs.tag }}
          CANAL_MANUAL: ${{ inputs.canal }}
          OBLIGATORIA_MANUAL: ${{ inputs.obligatoria }}
          NOTAS_MANUALES: ${{ inputs.notas }}
        run: |
          set -euo pipefail
          if [ -n "${TAG_MANUAL}" ]; then
            TAG="${TAG_MANUAL}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          if ! git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "El tag ${TAG} no existe en el repositorio." >&2
            exit 1
          fi
          # El artifact se publica con el nombre del commit compilado: si no es
          # el commit del tag, el artifact jamás podría publicarse y el error se
          # descubre en la fase de validación, no en la de publicación.
          COMMIT_TAG="$(git rev-parse "refs/tags/${TAG}^{commit}")"
          COMMIT_COMPILADO="$(git rev-parse HEAD)"
          if [ "${COMMIT_COMPILADO}" != "${COMMIT_TAG}" ]; then
            echo "HEAD (${COMMIT_COMPILADO}) no es el commit de ${TAG} (${COMMIT_TAG})." >&2
            echo "Para revalidar un tag existente: gh workflow run release.yml --ref ${TAG} -f tag=${TAG}" >&2
            exit 1
          fi
          VERSION_NAME="${TAG#v}"
          # El manifiesto solo acepta versiones numéricas con sufijo opcional:
          # un tag fuera de ese formato se rechaza acá y no se descubre en el
          # dispositivo.
          if ! [[ "${VERSION_NAME}" =~ ^[0-9]+(\.[0-9]+){0,3}([-+][0-9A-Za-z.\-]+)?$ ]]; then
            echo "El tag ${TAG} no produce un versionName válido: ${VERSION_NAME}" >&2
            exit 1
          fi
          if [ "${#VERSION_NAME}" -gt 64 ]; then
            echo "El versionName ${VERSION_NAME} supera los 64 caracteres que acepta la app." >&2
            exit 1
          fi
          # Monotónico dentro del repositorio: cualquier run posterior tiene un
          # número mayor, así que un release nunca retrocede el versionCode.
          VERSION_CODE="${GITHUB_RUN_NUMBER}"
          if [ -n "${CANAL_MANUAL}" ]; then
            CANAL="${CANAL_MANUAL}"
          elif [[ "${VERSION_NAME}" == *-* ]]; then
            # Cualquier sufijo (`-beta.1`, `-rc.1`, `-alpha`) es previo a la
            # versión estable: se publica en el canal beta, nunca en stable.
            CANAL="beta"
          else
            CANAL="stable"
          fi
          if [ -n "${NOTAS_MANUALES}" ]; then
            NOTAS="${NOTAS_MANUALES}"
          else
            NOTAS="$(git tag -l --format='%(contents)' "${TAG}")"
          fi
          if [ -z "${NOTAS}" ]; then
            NOTAS="CoperNicoTV ${VERSION_NAME}"
          fi
          # La app rechaza notas de más de 8000 caracteres; se recortan acá para
          # que un mensaje de tag largo no invalide el manifiesto publicado.
          if [ "${#NOTAS}" -gt 7900 ]; then
            NOTAS="${NOTAS:0:7900}…"
          fi
          OBLIGATORIA="${OBLIGATORIA_MANUAL:-false}"
          {
            echo "tag=${TAG}"
            echo "version_name=${VERSION_NAME}"
            echo "version_code=${VERSION_CODE}"
            echo "canal=${CANAL}"
            echo "obligatoria=${OBLIGATORIA}"
            echo "commit=${COMMIT_TAG}"
          } >> "${GITHUB_OUTPUT}"
          {
            echo "NOTAS<<__FIN_NOTAS__"
            echo "${NOTAS}"
            echo "__FIN_NOTAS__"
          } >> "${GITHUB_OUTPUT}"

      - name: Verificar que las claves están configuradas
        env:
          OTA_MANIFIESTO_PUBKEY: ${{ vars.OTA_MANIFIESTO_PUBKEY }}
          OTA_CERT_SHA256: ${{ vars.OTA_CERT_SHA256 }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          OTA_SIGNING_KEY_BASE64: ${{ secrets.OTA_SIGNING_KEY_BASE64 }}
        run: |
          set -euo pipefail
          faltan=0
          for NOMBRE in OTA_MANIFIESTO_PUBKEY OTA_CERT_SHA256 ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD OTA_SIGNING_KEY_BASE64; do
            if [ -z "${!NOMBRE:-}" ]; then
              echo "Falta ${NOMBRE}. Ejecutá tools/ota/generar-claves.sh y cargá claves y variables." >&2
              faltan=1
            fi
          done
          exit "${faltan}"

      - name: Materializar claves
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          OTA_SIGNING_KEY_BASE64: ${{ secrets.OTA_SIGNING_KEY_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/release.keystore"
          echo "${OTA_SIGNING_KEY_BASE64}" | base64 -d > "${RUNNER_TEMP}/ota-firma.pem"

      - name: Cache de FFmpeg compilado
        uses: actions/cache@v4
        with:
          path: native/ffmpeg/install
          key: ffmpeg-7.1.1-${{ runner.os }}-${{ hashFiles('scripts/ffmpeg/build-ffmpeg.sh') }}

      - name: Compilar subconjunto FFmpeg (LGPL)
        run: |
          [ -f native/ffmpeg/install/arm64-v8a/lib/libavcodec.a ] || \
            bash scripts/ffmpeg/build-ffmpeg.sh

      - name: Ensamblar APK release firmado
        env:
          OTA_MANIFIESTO_PUBKEY: ${{ vars.OTA_MANIFIESTO_PUBKEY }}
          OTA_CERT_SHA256: ${{ vars.OTA_CERT_SHA256 }}
          OTA_VERSION_CODE: ${{ steps.version.outputs.version_code }}
          OTA_VERSION_NAME: ${{ steps.version.outputs.version_name }}
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Componer y firmar el manifiesto
        id: manifiesto
        env:
          OTA_CERT_SHA256: ${{ vars.OTA_CERT_SHA256 }}
          OTA_MANIFIESTO_PUBKEY: ${{ vars.OTA_MANIFIESTO_PUBKEY }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          CANAL: ${{ steps.version.outputs.canal }}
          OBLIGATORIA: ${{ steps.version.outputs.obligatoria }}
          NOTAS: ${{ steps.version.outputs.notas }}
          REPOSITORIO: ${{ github.repository }}
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -1)"
          if [ -z "${APK}" ]; then
            echo "No se generó ningún APK release." >&2
            exit 1
          fi
          APK_NOMBRE="copernicotv-${VERSION_NAME}.apk"
          cp "${APK}" "${RUNNER_TEMP}/${APK_NOMBRE}"

          BUILD_TOOLS="$(ls -1d "${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"/build-tools/* | sort -V | tail -1)"
          # El rótulo del certificado depende de la implementación de apksigner:
          # la clásica imprime "Signer #1 certificate SHA-256 digest: …" y la
          # nueva de las build-tools recientes imprime
          # "V3.0 Signer: certificate SHA-256 digest: …". Se ancla en el sufijo
          # estable del rótulo para no atarse al prefijo de ninguna versión.
          SALIDA_APKSIGNER="$(
            "${BUILD_TOOLS}/apksigner" verify --verbose --print-certs \
              "${RUNNER_TEMP}/${APK_NOMBRE}" 2>&1 || true
          )"
          HUELLA_APK="$(
            printf '%s\n' "${SALIDA_APKSIGNER}" |
              sed -n 's/.*certificate SHA-256 digest: *//p' | head -1
          )"
          if ! [[ "${HUELLA_APK}" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "No se pudo leer la huella del certificado del APK (valor: '${HUELLA_APK}')." >&2
            echo "Salida de apksigner:" >&2
            printf '%s\n' "${SALIDA_APKSIGNER}" >&2
            exit 1
          fi
          if [ "${HUELLA_APK}" != "${OTA_CERT_SHA256}" ]; then
            echo "La firma del APK (${HUELLA_APK}) no es la fijada en la app (${OTA_CERT_SHA256})." >&2
            echo "El APK instalado rechazaría esta actualización: no se publica." >&2
            exit 1
          fi

          # El rótulo del minSdk depende de la herramienta: el aapt clásico
          # imprime "sdkVersion:'N'" y aapt2 imprime "minSdkVersion:'N'"
          # (tools/aapt2, rename d228691). Acá se invoca aapt2, así que el
          # patrón viejo devolvía vacío. Se aceptan los dos rótulos, anclados
          # al inicio de línea para no capturar targetSdkVersion.
          SALIDA_AAPT2="$(
            "${BUILD_TOOLS}/aapt2" dump badging "${RUNNER_TEMP}/${APK_NOMBRE}" 2>&1 || true
          )"
          MIN_SDK="$(
            printf '%s\n' "${SALIDA_AAPT2}" |
              sed -n "s/^minSdkVersion:'\([0-9]\{1,\}\)'.*/\1/p; s/^sdkVersion:'\([0-9]\{1,\}\)'.*/\1/p" |
              head -1
          )"
          if ! [[ "${MIN_SDK}" =~ ^[0-9]+$ ]]; then
            echo "No se pudo leer el minSdk del APK (valor: '${MIN_SDK}')." >&2
            echo "Salida de aapt2:" >&2
            printf '%s\n' "${SALIDA_AAPT2}" >&2
            exit 1
          fi

          SHA256="$(sha256sum "${RUNNER_TEMP}/${APK_NOMBRE}" | cut -d' ' -f1)"
          TAMANO="$(stat -c %s "${RUNNER_TEMP}/${APK_NOMBRE}")"
          # La app rechaza APK de más de 500 MiB y tamaños no positivos.
          if [ "${TAMANO}" -le 0 ] || [ "${TAMANO}" -gt 524288000 ]; then
            echo "Tamaño de APK fuera del rango que acepta la app: ${TAMANO} bytes." >&2
            exit 1
          fi
          PUBLICADO="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          jq -n \
            --argjson schema 1 \
            --arg packageName "com.copernicotv.app" \
            --argjson versionCode "${VERSION_CODE}" \
            --arg versionName "${VERSION_NAME}" \
            --arg channel "${CANAL}" \
            --argjson minSdk "${MIN_SDK}" \
            --arg publishedAt "${PUBLICADO}" \
            --argjson sizeBytes "${TAMANO}" \
            --arg sha256 "${SHA256}" \
            --arg downloadUrl "https://github.com/${REPOSITORIO}/releases/download/${TAG}/${APK_NOMBRE}" \
            --arg releaseUrl "https://github.com/${REPOSITORIO}/releases/tag/${TAG}" \
            --arg releaseNotes "${NOTAS}" \
            --argjson mandatory "${OBLIGATORIA}" \
            --arg signingCertSha256 "${HUELLA_APK}" \
            '{
              schema: $schema,
              packageName: $packageName,
              versionCode: $versionCode,
              versionName: $versionName,
              channel: $channel,
              minSdk: $minSdk,
              publishedAt: $publishedAt,
              sizeBytes: $sizeBytes,
              sha256: $sha256,
              downloadUrl: $downloadUrl,
              releaseUrl: $releaseUrl,
              releaseNotes: $releaseNotes,
              mandatory: $mandatory,
              signingCertSha256: $signingCertSha256
            }' > "${RUNNER_TEMP}/update.json"

          openssl dgst -sha256 \
            -sign "${RUNNER_TEMP}/ota-firma.pem" \
            -out "${RUNNER_TEMP}/update.json.sig" \
            "${RUNNER_TEMP}/update.json"
          openssl ec -in "${RUNNER_TEMP}/ota-firma.pem" -pubout \
            -out "${RUNNER_TEMP}/ota-firma.pub.pem" 2>/dev/null
          openssl dgst -sha256 \
            -verify "${RUNNER_TEMP}/ota-firma.pub.pem" \
            -signature "${RUNNER_TEMP}/update.json.sig" \
            "${RUNNER_TEMP}/update.json"

          # La verificación anterior usa una pública derivada de la MISMA clave
          # privada que acaba de firmar: prueba "firmé bien", no "la app podrá
          # verificar". Se compara con la clave que el APK lleva embebida.
          PUBLICA_DERIVADA="$(
            openssl ec -in "${RUNNER_TEMP}/ota-firma.pem" -pubout -outform DER 2>/dev/null |
              base64 -w 0
          )"
          if [ "${PUBLICA_DERIVADA}" != "${OTA_MANIFIESTO_PUBKEY}" ]; then
            echo "La clave que firma el manifiesto no es la que lleva la app." >&2
            echo "Todos los dispositivos rechazarían la actualización." >&2
            exit 1
          fi

          # El manifiesto debe describir exactamente el APK que se verificó y se
          # va a publicar.
          if [ "$(jq -r .sha256 "${RUNNER_TEMP}/update.json")" != "${SHA256}" ]; then
            echo "El manifiesto no corresponde al APK verificado." >&2
            exit 1
          fi

          {
            echo "apk=${RUNNER_TEMP}/${APK_NOMBRE}"
            echo "nombre=${APK_NOMBRE}"
            echo "sha256=${SHA256}"
          } >> "${GITHUB_OUTPUT}"

      - name: Publicar artefacto validado
        uses: actions/upload-artifact@v4
        with:
          # Nombre determinista: tag, commit, run e intento. El publicador lo
          # reconstruye desde la API y solo descarga ese nombre exacto.
          name: ota-${{ steps.version.outputs.tag }}-${{ steps.version.outputs.commit }}-r${{ github.run_id }}-a${{ github.run_attempt }}
          path: |
            ${{ steps.manifiesto.outputs.apk }}
            ${{ runner.temp }}/update.json
            ${{ runner.temp }}/update.json.sig
          if-no-files-found: error
          retention-days: 30

      - name: Resumen de validación
        env:
          TAG: ${{ steps.version.outputs.tag }}
          COMMIT: ${{ steps.version.outputs.commit }}
          SHA256: ${{ steps.manifiesto.outputs.sha256 }}
          ARTEFACTO: ota-${{ steps.version.outputs.tag }}-${{ steps.version.outputs.commit }}-r${{ github.run_id }}-a${{ github.run_attempt }}
        run: |
          {
            echo "## VALIDACIÓN — no se publicó ningún release"
            echo
            echo "- Tag: \`${TAG}\` (commit \`${COMMIT}\`)"
            echo "- APK: \`${{ steps.manifiesto.outputs.nombre }}\`"
            echo "- SHA-256 del APK: \`${SHA256}\`"
            echo "- versionCode: \`${{ steps.version.outputs.version_code }}\`"
            echo "- canal: \`${{ steps.version.outputs.canal }}\`"
            echo "- actualización obligatoria: \`${{ steps.version.outputs.obligatoria }}\`"
            echo "- artifact: \`${ARTEFACTO}\` (retención 30 días)"
            echo
            echo "Para publicar exactamente estos bytes:"
            echo '```'
            echo "gh workflow run release-publish.yml -f tag=${TAG} -f run_id=${{ github.run_id }}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
